name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run infra:synth -- -c lineLoginChannelId=1234567890 -c enableStaffAuth=true -c enablePhotoAccess=true > /dev/null
      - run: npm run infra:check:photo-asset
      - run: npm run build
