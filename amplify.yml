version: 1
applications:
  - appRoot: frontend/liff-app
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - (cd ../.. && npm ci)
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
